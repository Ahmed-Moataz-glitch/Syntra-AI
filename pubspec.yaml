name: syntra_ai
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  animate_do: ^5.1.0
  animated_bottom_navigation_bar: ^1.4.0
  animated_text_kit: ^4.3.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.1.4
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_offline: ^6.0.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.0
  flutter_web_auth_2: ^5.0.1
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  lottie: ^3.3.1
  persistent_bottom_nav_bar_v2: ^6.3.1
  pin_code_fields: ^9.0.0
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  smooth_page_indicator: ^2.0.1
  supabase_flutter: ^2.12.2
  toastification: ^3.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  intl_utils: ^2.8.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/splash_ios_android_11.png"

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/lotties/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 600

flutter_intl:
  enabled: true
